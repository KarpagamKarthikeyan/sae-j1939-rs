[package]
name = "sae-j1939-host"
description = "Host-side (std) transport and tooling for sae-j1939-rs: Linux SocketCAN transport for J1939 traffic."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/sae-j1939-host"
readme = "../README.md"

# The SocketCAN transport and `Ecu` are Linux-only, so docs must be built for a
# Linux target or the crate would document as empty.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[dependencies]
sae-j1939-rs = { workspace = true, features = ["std"] }

# SocketCAN is a Linux-only kernel interface; only pull it in on Linux so the
# rest of the host crate still builds on macOS/Windows.
[target.'cfg(target_os = "linux")'.dependencies]
socketcan.workspace = true
